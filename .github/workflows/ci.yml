name: Core CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
  website-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website-react
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: |
          npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify root and project base builds
        run: |
          test -f dist/index.html
          VITE_BASE_PATH=/traceOps/ npm run build
          grep -q '/traceOps/assets/' dist/index.html
  browser-acceptance:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website-react
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install pinned browser test runner in isolated temporary project
        run: |
          cp -r browser-runner "$RUNNER_TEMP/traceops-browser"
          npm install --prefix "$RUNNER_TEMP/traceops-browser" --no-audit --no-fund --ignore-scripts
          echo "BROWSER_LOCK_BEGIN"
          cat "$RUNNER_TEMP/traceops-browser/package-lock.json"
          echo "BROWSER_LOCK_END"
          npm audit --prefix "$RUNNER_TEMP/traceops-browser" --audit-level=high
          ln -s "$RUNNER_TEMP/traceops-browser/node_modules/@playwright" node_modules/@playwright
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test
